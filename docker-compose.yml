services:
  db:
    image: postgres:16
    container_name: repair-db
    environment:
      POSTGRES_DB: repair_db
      POSTGRES_USER: repair_admin
      # Пароль администратора берётся из .env (секреты не хранятся в коде)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - repair_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repair_admin -d repair_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  repair_pgdata:
